<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Profile Generator</title>
<style>
  :root{
    --paper: #FAF6EC;
    --paper-line: #E4DCC8;
    --ink: #1F2A44;
    --ink-soft: #4A5570;
    --gold: #B8912E;
    --gold-soft: #EFE3C0;
    --card-shadow: rgba(31,42,68,0.18);
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background: var(--paper);
    background-image:
      repeating-linear-gradient(var(--paper-line) 0 1px, transparent 1px 32px);
    color: var(--ink);
    font-family: "Iowan Old Style","Georgia","Times New Roman",serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 40px 20px 80px;
  }

  header{
    text-align:center;
    max-width:640px;
    margin-bottom:36px;
  }

  .eyebrow{
    font-family: "Helvetica Neue", Arial, sans-serif;
    letter-spacing: 0.22em;
    text-transform:uppercase;
    font-size:12px;
    color: var(--gold);
    margin:0 0 10px;
    font-weight:600;
  }

  h1{
    font-size: clamp(28px, 5vw, 42px);
    margin: 0 0 12px;
    line-height:1.15;
  }

  header p{
    font-family: "Helvetica Neue", Arial, sans-serif;
    color: var(--ink-soft);
    font-size:15px;
    margin:0;
  }

  main{
    width:100%;
    max-width: 980px;
    display:grid;
    grid-template-columns: minmax(0,420px) minmax(0,1fr);
    gap: 40px;
    align-items:start;
  }

  @media (max-width: 800px){
    main{ grid-template-columns: 1fr; }
  }

  form{
    background: #fff;
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    padding: 28px 28px 32px;
    box-shadow: 0 10px 30px -18px var(--card-shadow);
  }

  fieldset{
    border:0;
    padding:0;
    margin:0;
  }

  legend{
    font-family: "Helvetica Neue", Arial, sans-serif;
    text-transform:uppercase;
    letter-spacing:0.14em;
    font-size:11px;
    color: var(--gold);
    font-weight:700;
    padding:0 0 18px;
  }

  .field{
    margin-bottom: 18px;
  }

  label{
    display:block;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom:6px;
  }

  input, select{
    width:100%;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size:15px;
    padding: 10px 12px;
    border: 1px solid #D8D1BE;
    border-radius: 3px;
    background: #FFFDF8;
    color: var(--ink);
  }

  input:focus, select:focus, button:focus{
    outline: 2px solid var(--gold);
    outline-offset: 1px;
  }

  button{
    margin-top: 6px;
    width:100%;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-weight:700;
    letter-spacing:0.04em;
    font-size:14px;
    padding: 12px 16px;
    background: var(--ink);
    color: #FAF6EC;
    border:0;
    border-radius: 3px;
    cursor:pointer;
    transition: background .15s ease, transform .15s ease;
  }

  button:hover{ background:#2c3a5f; }
  button:active{ transform: translateY(1px); }

  /* --- Generated ID card --- */
  #output{
    min-height: 100%;
  }

  .placeholder{
    font-family: "Helvetica Neue", Arial, sans-serif;
    color: var(--ink-soft);
    font-size:14px;
    border: 1px dashed var(--paper-line);
    border-radius:4px;
    padding: 40px 20px;
    text-align:center;
    background: rgba(255,255,255,0.4);
  }

  .id-card{
    background:#fff;
    border-radius:10px;
    overflow:hidden;
    box-shadow: 0 18px 40px -20px var(--card-shadow);
    border: 1px solid var(--paper-line);
    animation: rise .35s ease;
  }

  @keyframes rise{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .id-card__top{
    background: var(--ink);
    color: var(--paper);
    padding: 16px 22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }

  .id-card__top .mark{
    font-weight:700;
    letter-spacing:0.08em;
    font-size:13px;
    text-transform:uppercase;
  }

  .id-card__top .mark span{ color: var(--gold); }

  .id-card__top .id-no{
    font-size:11px;
    opacity:0.7;
  }

  .id-card__body{
    display:flex;
    gap:20px;
    padding: 24px 22px 26px;
  }

  .avatar{
    flex: 0 0 84px;
    width:84px;
    height:84px;
    border-radius:50%;
    background: var(--gold-soft);
    color: var(--gold);
    font-family: "Iowan Old Style", Georgia, serif;
    font-size: 30px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    border: 2px solid var(--gold);
  }

  .id-card__details{ flex:1; min-width:0; }

  .id-card__details h2{
    margin:0 0 4px;
    font-size: 22px;
    line-height:1.2;
    word-break: break-word;
  }

  .id-card__details .branch-tag{
    font-family: "Helvetica Neue", Arial, sans-serif;
    display:inline-block;
    background: var(--gold-soft);
    color: #8a6a1c;
    font-size: 11px;
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding: 3px 9px;
    border-radius: 3px;
    margin-bottom: 12px;
  }

  dl{
    margin:0;
    display:grid;
    grid-template-columns: auto 1fr;
    column-gap:12px;
    row-gap:6px;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 13.5px;
  }

  dt{
    color: var(--ink-soft);
    font-weight:600;
  }

  dd{
    margin:0;
    color: var(--ink);
  }

  .id-card__bottom{
    border-top: 1px dashed var(--paper-line);
    padding: 10px 22px;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 10.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color: var(--ink-soft);
    text-align:center;
  }

  footer{
    margin-top:56px;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size:12px;
    color: var(--ink-soft);
    text-align:center;
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Day 1 &middot; Semantic HTML</p>
  <h1>Student Profile Generator</h1>
  <p>Enter a student's details to generate a formatted profile card.</p>
</header>

<main>
  <form id="profile-form" autocomplete="off">
    <fieldset>
      <legend>Student details</legend>

      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" placeholder="e.g. Ananya Sharma" required>
      </div>

      <div class="field">
        <label for="age">Age</label>
        <input type="number" id="age" name="age" min="10" max="100" placeholder="e.g. 20" required>
      </div>

      <div class="field">
        <label for="college">College / institution</label>
        <input type="text" id="college" name="college" placeholder="e.g. Rajasthan Institute of Technology" required>
      </div>

      <div class="field">
        <label for="branch">Branch / major</label>
        <input type="text" id="branch" name="branch" placeholder="e.g. Computer Science" required>
      </div>

      <button type="button" id="generate-btn">Generate profile</button>
    </fieldset>
  </form>

  <section id="output" aria-live="polite">
    <p class="placeholder">Your generated student ID card will appear here.</p>
  </section>
</main>

<footer>
  <p>Built with semantic HTML, CSS and vanilla JavaScript &mdash; no frameworks.</p>
</footer>

<script>
  const output = document.getElementById('output');
  const generateBtn = document.getElementById('generate-btn');

  function initials(name){
    return name
      .trim()
      .split(/\s+/)
      .slice(0, 2)
      .map(function(word){ return word.charAt(0).toUpperCase(); })
      .join('');
  }

  function randomId(){
    return 'STU-' + Math.floor(100000 + Math.random() * 900000);
  }

  function generateProfile(){
    const name = document.getElementById('name').value.trim();
    const age = document.getElementById('age').value.trim();
    const college = document.getElementById('college').value.trim();
    const branch = document.getElementById('branch').value.trim();

    if(!name || !age || !college || !branch){
      output.innerHTML = '<p class="placeholder">Please fill in all four fields, then click Generate profile.</p>';
      return;
    }

    output.innerHTML = `
      <article class="id-card">
        <div class="id-card__top">
          <span class="mark">Student<span>ID</span></span>
          <span class="id-no">${randomId()}</span>
        </div>
        <div class="id-card__body">
          <div class="avatar" aria-hidden="true">${initials(name)}</div>
          <div class="id-card__details">
            <h2>${name}</h2>
            <span class="branch-tag">${branch}</span>
            <dl>
              <dt>Age</dt><dd>${age}</dd>
              <dt>College</dt><dd>${college}</dd>
              <dt>Branch</dt><dd>${branch}</dd>
            </dl>
          </div>
        </div>
        <div class="id-card__bottom">Generated for demonstration purposes</div>
      </article>
    `;
  }

  generateBtn.addEventListener('click', generateProfile);
</script>

</body>
</html>
